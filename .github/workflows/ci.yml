name: TSCP Verification Predicate CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# T5: unique run groups avoid both running-job cancellation and replacement
# of pending runs. cancel-in-progress: false alone does not preserve pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-11-19

# The Rust crate lives in tools/tscp-canon/; without this every cargo
# invocation runs at the repo root, cannot find Cargo.toml, and fails.
defaults:
  run:
    working-directory: tools/tscp-canon

jobs:
  fmt:
    name: Formatting (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/tscp-canon
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (cargo clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/tscp-canon
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/tscp-canon
      - name: Run tests (AVX-512 conditional)
        run: |
          if grep -q "avx512" /proc/cpuinfo 2>/dev/null; then
            RUSTFLAGS="-C target-cpu=native" cargo test --workspace --release
          else
            cargo test --workspace --release
          fi

  audit:
    name: Supply Chain (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  receipt-write-policy:
    name: Receipt write policy (py)
    runs-on: ubuntu-latest
    # The acceptance-receipt generator must never replace a committed PASS with a
    # FAIL just because this host lacks a toolchain. This job pins that behaviour
    # with a hermetic test (stubbed legs, no cargo/node needed).
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest tests/test_receipt_write_policy.py -v

  toolchain-pin:
    name: Toolchain pin (T4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve declared channel
        id: declared
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          declared = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          expected = os.environ["RUST_TOOLCHAIN"]
          if not re.fullmatch(r"nightly-\d{4}-\d{2}-\d{2}", expected) or declared != expected:
              raise SystemExit(f"TOOLCHAIN_DECLARATION_DRIFT declared={declared} expected={expected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={declared}\n")
          PY
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ steps.declared.outputs.channel }}
      - name: Assert resolved compiler matches declaration
        run: |
          set -euo pipefail
          want="${{ steps.declared.outputs.channel }}"
          active=$(rustup show active-toolchain | awk '{print $1}')
          rustc -vV | tee toolchain-identity.txt
          echo "declared=$want active=$active"
          case "$active" in
            "$want-$(rustc -vV | sed -n 's/^host: //p')") echo "TOOLCHAIN_PINNED $active" ;;
            *) echo "TOOLCHAIN_DRIFT declared=$want active=$active" >&2; exit 1 ;;
          esac
          # Compiler commit-date is evidence, not the nightly distribution date.
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-identity
          path: toolchain-identity.txt

  conformance:
    name: Three-language conformance (F09)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: triune-handoff-ts/package-lock.json
      # T2: a missing toolchain must fail loudly and name itself, so a path error
      # can never be mistaken for an absent toolchain.
      - name: Probe required toolchains
        run: |
          set -euo pipefail
          for t in python3 node npm; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "TOOLCHAIN_MISSING $t" >&2
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tools/tscp-canon
      - name: Python oracle verifies the committed manifest
        run: python3 reference_canon.py verify
      - name: TypeScript implementation against the same manifest
        working-directory: triune-handoff-ts
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx --no-install ts-node scripts/run_conformance.ts
      - name: Rust implementation against the same manifest
        working-directory: tools/tscp-canon
        run: cargo test --test conformance -- --nocapture

  authority:
    name: Seal authority (T5)
    needs: [conformance]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Reject a superseded seal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs"
          current=$(gh api "$api/$GITHUB_RUN_ID")
          mine=$(jq -er '.created_at' <<< "$current")
          wf=$(jq -er '.workflow_id' <<< "$current")
          # Workflow-scoped endpoint, complete pagination, and no head_sha/event
          # filter: GitHub caps filtered run searches at 1,000 results.
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" > authority-runs.json
          newer=$(jq -er --arg me "$mine" --arg id "$GITHUB_RUN_ID" \
            --argjson wf "$wf" --arg sha "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" \
            '[.[] | .workflow_runs[]
              | select(.workflow_id == $wf)
              | select((.id | tostring) != $id)
              | select(.head_sha == $sha and .event == $event)
              | select(.status == "completed" and .created_at > $me)] | length' authority-runs.json)
          echo "this_run=$GITHUB_RUN_ID workflow=$wf created=$mine newer_completed=$newer"
          if [ "$newer" != "0" ]; then
            echo "SEAL_SUPERSEDED this=$GITHUB_RUN_ID newer_completed=$newer" >&2
            exit 1
          fi
          echo "SEAL_AUTHORITATIVE $GITHUB_RUN_ID"

  verify:
    name: Verification Seal
    needs: [fmt, clippy, test, audit, receipt-write-policy, toolchain-pin, conformance, authority]
    if: always()
    runs-on: ubuntu-latest
    # This job runs no cargo command; override the workflow-level working
    # directory so it does not depend on the crate directory existing.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Evaluate all gates
        run: |
          if [ "${{ needs.fmt.result }}" = "success" ] && \
             [ "${{ needs.clippy.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.audit.result }}" = "success" ] && \
             [ "${{ needs.receipt-write-policy.result }}" = "success" ] && \
             [ "${{ needs.toolchain-pin.result }}" = "success" ] && \
             [ "${{ needs.conformance.result }}" = "success" ] && \
             [ "${{ needs.authority.result }}" = "success" ]; then
            echo "TSCP VERIFICATION PREDICATE: PASS"
          else
            echo "TSCP VERIFICATION PREDICATE: FAIL"
            exit 1
          fi
